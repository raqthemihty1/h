<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- 1. The Meta Refresh Redirect (0 = seconds to wait before redirecting) -->
    <meta http-equiv="refresh" content="0; url=https://your-destination-website.com">
    <!-- 2. Canonical link to tell search engines where the real content lives -->
    <link rel="canonical" href="https://www.youtube.com/">
</head>
<body>
    <!-- Fallback message in case the user has redirects disabled -->
    <p>Redirecting you to our new home... If you are not redirected automatically, 
       <a href="https://your-destination-website.com">click here</a>.</p>
</body>
</html>
