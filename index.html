<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- 1. The Meta Refresh Redirect (0 seconds wait) -->
    <meta http-equiv="refresh" content="0; url=https://youtube.com">
    <!-- 2. Canonical link for search engine optimization -->
    <link rel="canonical" href="https://youtube.com">
</head>
<body>
    <!-- Fallback link in case automatic redirect fails -->
    <p>Redirecting you to YouTube... If you are not redirected automatically, 
       <a href="https://youtube.com">click here</a>.</p>
</body>
</html>
